<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tidy — Teddy Sketch to 3D</title>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1>Tidy</h1>
        <p class="subtitle">
          Draw a closed loop, then step through T/S/J → fans → spine → elevation → inflation
          <span class="paper-ref">(Igarashi et al., SIGGRAPH 1999)</span>
        </p>
      </header>
      <main class="workspace">
        <section class="panel">
          <div class="panel-head">
            <h2>Canvas</h2>
            <div class="view-controls">
              <label class="display-mode-label" for="display-mode">Display</label>
              <select id="display-mode" aria-label="Mesh display mode" disabled>
                <option value="solid">Solid</option>
                <option value="wireframe">Wireframe</option>
                <option value="both" selected>Both</option>
              </select>
              <label class="paint-toggle">
                <input type="checkbox" id="paint-mode" disabled />
                Paint
              </label>
              <label class="paint-toggle">
                <input type="checkbox" id="cut-mode" disabled />
                Cut
              </label>
              <label class="paint-toggle">
                <input type="checkbox" id="extrude-mode" disabled />
                Extrude
              </label>
              <label class="paint-toggle">
                <input type="checkbox" id="sketch-mode" disabled />
                Sketch
              </label>
            </div>
            <div class="paint-palette" id="paint-palette" hidden>
              <span class="paint-palette-label">Color</span>
              <button type="button" class="swatch" data-color="#d1495b" style="background:#d1495b" aria-label="Red"></button>
              <button type="button" class="swatch" data-color="#f4a259" style="background:#f4a259" aria-label="Orange"></button>
              <button type="button" class="swatch" data-color="#f4d35e" style="background:#f4d35e" aria-label="Yellow"></button>
              <button type="button" class="swatch" data-color="#3a9d4e" style="background:#3a9d4e" aria-label="Green"></button>
              <button type="button" class="swatch" data-color="#2a9d8f" style="background:#2a9d8f" aria-label="Teal"></button>
              <button type="button" class="swatch" data-color="#2274a5" style="background:#2274a5" aria-label="Blue"></button>
              <button type="button" class="swatch" data-color="#7b4fb5" style="background:#7b4fb5" aria-label="Purple"></button>
              <button type="button" class="swatch" data-color="#3d3d3d" style="background:#3d3d3d" aria-label="Charcoal"></button>
              <button type="button" class="swatch" data-color="#ffffff" style="background:#ffffff" aria-label="White"></button>
              <input type="color" id="paint-color" value="#d1495b" aria-label="Custom paint color" />
              <span class="paint-brush">
                <label for="paint-brush">Brush</label>
                <input type="range" id="paint-brush" min="2" max="60" step="1" value="16" aria-label="Brush thickness" />
                <span class="brush-value" id="paint-brush-value">16</span>
              </span>
            </div>
            <span class="inflation-step" id="inflation-step" aria-live="polite"></span>
            <span class="hint" id="canvas-hint">Draw one closed loop on the 3D plane</span>
          </div>
          <div class="canvas-wrap">
            <div id="scene-view" class="scene-view"></div>
          </div>
          <div class="actions">
            <button id="btn-next-step" type="button" disabled>Next step</button>
            <button id="btn-apply-cut" type="button" disabled>Remove triangles</button>
            <button id="btn-fill-cut" type="button" disabled>Fill hole</button>
            <button id="btn-discard-cut" type="button" class="secondary" disabled>
              Discard cut
            </button>
            <button id="btn-confirm-extrude" type="button" disabled>
              Confirm orientation
            </button>
            <button id="btn-circle" type="button" class="secondary">Create circle</button>
            <button id="btn-square" type="button" class="secondary">Create square</button>
            <button id="btn-clear" type="button" class="secondary">Clear</button>
          </div>
          <p id="status" class="status" role="status"></p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
