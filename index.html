<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tidy — Teddy Sketch to 3D</title>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1>Tidy</h1>
        <p class="subtitle">
          Draw a closed silhouette once on the 3D plane — then rotate, zoom, and pan
          <span class="paper-ref">(Igarashi et al., SIGGRAPH 1999)</span>
        </p>
      </header>
      <main class="workspace">
        <section class="panel">
          <div class="panel-head">
            <h2>Canvas</h2>
            <div class="view-controls">
              <label class="display-mode-label" for="display-mode">Display</label>
              <select id="display-mode" aria-label="Mesh display mode" disabled>
                <option value="solid">Solid</option>
                <option value="wireframe" selected>Wireframe</option>
                <option value="both">Both</option>
              </select>
              <label class="paint-toggle">
                <input type="checkbox" id="paint-mode" disabled />
                Paint on surface
              </label>
              <label class="paint-toggle">
                <input type="checkbox" id="cut-mode" disabled />
                Cut mode
              </label>
            </div>
            <span class="hint" id="canvas-hint">Draw one closed loop on the 3D plane</span>
          </div>
          <div class="canvas-wrap">
            <div id="scene-view" class="scene-view"></div>
          </div>
          <div class="actions">
            <button id="btn-square" type="button" class="secondary">Create square</button>
            <button id="btn-clear" type="button" class="secondary">Clear</button>
          </div>
          <p id="status" class="status" role="status"></p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
